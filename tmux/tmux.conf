# Use Zsh for new tmux windows and panes.
set -g default-shell /bin/zsh
set -g default-command ""

# Use xterm-256color for application compatibility; retain truecolor support.
set -g default-terminal "xterm-256color"
set -ag terminal-features ",xterm-256color:RGB"
set -ag terminal-features ",xterm*:RGB"
set -ag terminal-features ",wezterm*:RGB"
set -ag terminal-features ",WezTerm*:RGB"
# Also cover common SSH terminals and nested tmux sessions.
set -as terminal-features ",tmux*:RGB,screen-256color:RGB,alacritty*:RGB,foot*:RGB,xterm-kitty:RGB"
# Compatibility fallback for applications/clients using the Tc capability.
set -as terminal-overrides ",xterm*:Tc,tmux*:Tc,screen-256color:Tc,wezterm*:Tc,WezTerm*:Tc,alacritty*:Tc,foot*:Tc"
set-environment -g COLORTERM truecolor

# Use Ctrl+\ as the prefix key instead of Ctrl+b.
unbind C-b
set -g prefix C-\\
bind C-\\ send-prefix

set -g mouse on

# Enable modified Enter and other extended key sequences.
set -g extended-keys on
